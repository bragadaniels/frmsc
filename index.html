<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tocador de Áudio</title>
    <style>
        :root {
            --bg: #121212;
            --card: #181818;
            --accent: #1db954;
            --text-dim: #b3b3b3;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: #fff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--card);
            color: #fff;
            font-size: 14px;
        }

        button {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        /* Cartão de Áudio */
        .audio-card {
            background: var(--card);
            padding: 24px 16px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .music-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .track-title {
            font-size: 18px;
            font-weight: bold;
            margin: 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 16px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .btn-ctrl {
            background: #282828;
            font-size: 16px;
            padding: 10px 14px;
            border-radius: 50px;
        }

        .btn-play {
            background: var(--accent);
            font-size: 20px;
            padding: 14px 20px;
        }

        .btn-ctrl.active {
            background: var(--accent);
        }

        /* Vídeo oculto */
        #hidden-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            top: -9999px;
            left: -9999px;
        }

        /* Lista de Músicas */
        .playlist-container {
            background: var(--card);
            border-radius: 16px;
            padding: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .track-item {
            padding: 14px;
            border-bottom: 1px solid #242424;
            cursor: pointer;
            border-radius: 8px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-item:hover {
            background-color: #282828;
        }

        .track-item.playing {
            color: var(--accent);
            font-weight: bold;
            background-color: #1a2e20;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="input-group">
        <input type="text" id="playlistInput" placeholder="Link da Playlist do YouTube">
        <button onclick="carregarPlaylist()">Carregar</button>
    </div>

    <div class="audio-card">
        <div class="music-icon">🎵</div>
        <div class="track-title" id="currentTitle">Nenhuma música tocando</div>
        <div class="status" id="statusText">Cole a playlist acima</div>

        <div class="controls">
            <button class="btn-ctrl" onclick="voltar()">⏮</button>
            <button class="btn-ctrl btn-play" id="btnPlayPause" onclick="togglePlayPause()">▶</button>
            <button class="btn-ctrl" onclick="pular()">⏭</button>
            <button class="btn-ctrl" id="btnShuffle" onclick="alternarShuffle()">🔀</button>
        </div>
    </div>

    <div class="playlist-container" id="playlistContainer"></div>
</div>

<div id="hidden-player"></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    let player;
    let isShuffle = false;
    let isPlaying = false;
    let titulosCache = {};

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('hidden-player', {
            height: '1',
            width: '1',
            playerVars: {
                'playsinline': 1,
                'controls': 0
            },
            events: {
                'onReady': () => {
                    document.getElementById('statusText').innerText = "Pronto para carregar";
                },
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function extrairPlaylistId(urlOuId) {
        const match = urlOuId.match(/[?&]list=([^#&?]+)/);
        return match ? match[1] : urlOuId.trim();
    }

    async function carregarPlaylist() {
        const val = document.getElementById('playlistInput').value;
        const playlistId = extrairPlaylistId(val);

        if (!playlistId) {
            alert('Cole um link ou ID de playlist válido!');
            return;
        }

        document.getElementById('statusText').innerText = "Carregando músicas...";

        // 1. Inicia a playlist no player oculto
        player.loadPlaylist({
            listType: 'playlist',
            list: playlistId,
            index: 0
        });

        // 2. Busca os nomes reais de todas as faixas
        buscarNomesPlaylist(playlistId);
    }

    // Busca os nomes de uma vez via instâncias de API
    async function buscarNomesPlaylist(playlistId) {
        const container = document.getElementById('playlistContainer');
        container.innerHTML = '<div style="padding:15px; color:#888;">Identificando músicas...</div>';

        let titulosEncontrados = false;
        const instancias = [
            "https://invidious.nerdvpn.de",
            "https://invidious.tiekoetter.com",
            "https://yt.chocolatemoo53.com"
        ];

        for (const inst of instancias) {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 3000);
                const res = await fetch(`${inst}/api/v1/playlists/${playlistId}`, { signal: controller.signal });
                clearTimeout(timeout);

                if (res.ok) {
                    const data = await res.json();
                    if (data.videos && data.videos.length > 0) {
                        data.videos.forEach((v, idx) => {
                            titulosCache[idx] = v.title;
                        });
                        titulosEncontrados = true;
                        break;
                    }
                }
            } catch (e) {}
        }

        // Renderiza a lista com os nomes
        setTimeout(() => {
            montarListaVisual();
            // Se a API não respondeu tudo, busca o restante via Noembed
            if (!titulosEncontrados) {
                buscarTitulosFallback();
            }
        }, 1500);
    }

    function montarListaVisual() {
        const container = document.getElementById('playlistContainer');
        container.innerHTML = '';

        const videoIds = player.getPlaylist();
        if (!videoIds || videoIds.length === 0) return;

        videoIds.forEach((id, index) => {
            const div = document.createElement('div');
            div.className = 'track-item';
            div.id = `item-${index}`;

            const nome = titulosCache[index] || `Música ${index + 1}...`;
            div.innerText = `${index + 1}. ${nome}`;
            div.onclick = () => tocarIndice(index);
            container.appendChild(div);
        });

        atualizarInfoMusica();
    }

    // Fallback: se a API rápida falhar, puxa o nome individual pelo Noembed
    function buscarTitulosFallback() {
        const videoIds = player.getPlaylist() || [];
        videoIds.forEach((id, index) => {
            if (titulosCache[index]) return;

            fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`)
                .then(r => r.json())
                .then(data => {
                    if (data.title) {
                        titulosCache[index] = data.title;
                        const el = document.getElementById(`item-${index}`);
                        if (el) el.innerText = `${index + 1}. ${data.title}`;
                    }
                })
                .catch(() => {});
        });
    }

    function onPlayerStateChange(event) {
        const playBtn = document.getElementById('btnPlayPause');

        if (event.data === YT.PlayerState.PLAYING) {
            isPlaying = true;
            playBtn.innerText = "⏸";
            atualizarInfoMusica();
        } else if (event.data === YT.PlayerState.PAUSED) {
            isPlaying = false;
            playBtn.innerText = "▶";
        } else if (event.data === YT.PlayerState.ENDED) {
            atualizarInfoMusica();
        }
    }

    function togglePlayPause() {
        if (!player) return;
        if (isPlaying) {
            player.pauseVideo();
        } else {
            player.playVideo();
        }
    }

    function pular() {
        if (player && player.nextVideo) player.nextVideo();
    }

    function voltar() {
        if (player && player.previousVideo) player.previousVideo();
    }

    function alternarShuffle() {
        isShuffle = !isShuffle;
        const btn = document.getElementById('btnShuffle');
        btn.classList.toggle('active', isShuffle);

        if (player && player.setShuffle) {
            player.setShuffle(isShuffle);
        }
    }

    function tocarIndice(idx) {
        if (player && player.playVideoAt) {
            player.playVideoAt(idx);
        }
    }

    function atualizarInfoMusica() {
        if (!player || !player.getPlaylistIndex) return;
        const idx = player.getPlaylistIndex();
        const total = player.getPlaylist() ? player.getPlaylist().length : 0;

        const data = player.getVideoData();
        let tituloAtual = (data && data.title) ? data.title : titulosCache[idx];

        if (tituloAtual) {
            document.getElementById('currentTitle').innerText = tituloAtual;
            const el = document.getElementById(`item-${idx}`);
            if (el) el.innerText = `${idx + 1}. ${tituloAtual}`;
        }

        document.getElementById('statusText').innerText = `Tocando ${idx + 1} de ${total}`;

        document.querySelectorAll('.track-item').forEach(el => el.classList.remove('playing'));
        const ativo = document.getElementById(`item-${idx}`);
        if (ativo) {
            ativo.classList.add('playing');
            ativo.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }
</script>
</body>
</html>
