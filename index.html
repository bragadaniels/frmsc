<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player de Playlist Sem Anúncios</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #1db954;
            --hover-color: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--card-color);
            color: #fff;
            font-size: 14px;
        }

        button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            opacity: 0.8;
        }

        /* Player */
        .player-card {
            background: var(--card-color);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
        }

        iframe {
            width: 100%;
            height: 260px;
            border-radius: 8px;
            border: none;
            background: #000;
        }

        .track-title {
            font-size: 16px;
            font-weight: bold;
            margin: 12px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-ctrl {
            background: #333;
            font-size: 14px;
        }

        .btn-ctrl.active {
            background: var(--accent-color);
        }

        /* Lista */
        .playlist-container {
            background: var(--card-color);
            border-radius: 12px;
            padding: 8px;
            max-height: 380px;
            overflow-y: auto;
        }

        .track-item {
            padding: 12px;
            border-bottom: 1px solid #282828;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .track-item:hover {
            background-color: var(--hover-color);
        }

        .track-item.playing {
            color: var(--accent-color);
            font-weight: bold;
            background-color: #1a2e20;
        }

        .status {
            font-size: 12px;
            color: #aaa;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="input-group">
        <input type="text" id="playlistInput" placeholder="Link ou ID da Playlist do YouTube">
        <button onclick="carregarPlaylist()">Abrir</button>
    </div>

    <div class="player-card">
        <!-- Iframe do Invidious: sem anúncios e sem bloqueio 403 -->
        <iframe id="mediaPlayer" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        <div class="track-title" id="currentTitle">Nenhuma música carregada</div>

        <div class="controls">
            <button class="btn-ctrl" onclick="anteriorMusica()">⏮ Voltar</button>
            <button class="btn-ctrl" onclick="proximaMusica()">Pular ⏭</button>
            <button class="btn-ctrl" id="btnShuffle" onclick="toggleShuffle()">🔀 Aleatório: OFF</button>
        </div>
        <div class="status" id="statusText">Cole a playlist e clique em Abrir</div>
    </div>

    <div class="playlist-container" id="playlistContainer">
        <!-- Itens da playlist aparecerão aqui -->
    </div>
</div>

<script>
    // Lista de instâncias públicas estáveis
    const INSTANCIAS = [
        "https://inv.nadeko.net",
        "https://invidious.nerdvpn.de",
        "https://invidious.jing.rocks"
    ];
    let instanciaAtual = INSTANCIAS[0];

    let playlistOriginal = [];
    let ordemReproducao = [];
    let ponteiro = 0;
    let isShuffle = false;
    let timerAutoSkip = null;

    const player = document.getElementById('mediaPlayer');
    const titleEl = document.getElementById('currentTitle');
    const statusEl = document.getElementById('statusText');
    const container = document.getElementById('playlistContainer');
    const btnShuffle = document.getElementById('btnShuffle');

    function extrairPlaylistId(urlOuId) {
        const match = urlOuId.match(/[?&]list=([^#&?]+)/);
        return match ? match[1] : urlOuId.trim();
    }

    async function carregarPlaylist() {
        const inputVal = document.getElementById('playlistInput').value;
        const playlistId = extrairPlaylistId(inputVal);

        if (!playlistId) {
            alert('Por favor, informe uma URL ou ID de playlist válido!');
            return;
        }

        statusEl.innerText = "Carregando músicas da playlist...";
        
        let sucesso = false;
        for (const inst of INSTANCIAS) {
            try {
                instanciaAtual = inst;
                const res = await fetch(`${instanciaAtual}/api/v1/playlists/${playlistId}`);
                if (!res.ok) continue;
                
                const data = await res.json();
                playlistOriginal = data.videos || [];
                
                if (playlistOriginal.length > 0) {
                    sucesso = true;
                    break;
                }
            } catch (e) {
                console.warn(`Instância ${inst} falhou. Tentando próxima...`);
            }
        }

        if (!sucesso) {
            statusEl.innerText = "Erro ao carregar playlist. Tente novamente mais tarde.";
            return;
        }

        configurarOrdem();
        renderizarLista();
        tocarIndice(0);
    }

    function configurarOrdem() {
        ordemReproducao = playlistOriginal.map((_, i) => i);
        if (isShuffle) {
            embaralhar(ordemReproducao);
        }
    }

    function embaralhar(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        btnShuffle.classList.toggle('active', isShuffle);
        btnShuffle.innerText = isShuffle ? "🔀 Aleatório: ON" : "🔀 Aleatório: OFF";

        const videoAtualIdx = ordemReproducao[ponteiro];
        configurarOrdem();
        ponteiro = Math.max(0, ordemReproducao.indexOf(videoAtualIdx));
    }

    function tocarIndice(novoPonteiro) {
        if (novoPonteiro < 0 || novoPonteiro >= ordemReproducao.length) return;
        ponteiro = novoPonteiro;

        const videoIndexOriginal = ordemReproducao[ponteiro];
        const video = playlistOriginal[videoIndexOriginal];

        titleEl.innerText = video.title;
        statusEl.innerText = `Tocando ${ponteiro + 1} de ${ordemReproducao.length}`;

        // Carrega o player sem anúncios via embed do Invidious
        player.src = `${instanciaAtual}/embed/${video.videoId}?autoplay=1`;

        atualizarDestaqueLista();

        // Autoplay para a próxima música com base na duração informada pela API
        if (timerAutoSkip) clearTimeout(timerAutoSkip);
        if (video.lengthSeconds && video.lengthSeconds > 0) {
            timerAutoSkip = setTimeout(() => {
                proximaMusica();
            }, (video.lengthSeconds + 1) * 1000);
        }
    }

    function proximaMusica() {
        if (ponteiro + 1 < ordemReproducao.length) {
            tocarIndice(ponteiro + 1);
        } else {
            statusEl.innerText = "Fim da playlist";
        }
    }

    function anteriorMusica() {
        if (ponteiro > 0) {
            tocarIndice(ponteiro - 1);
        }
    }

    function renderizarLista() {
        container.innerHTML = '';
        playlistOriginal.forEach((v, indexOriginal) => {
            const div = document.createElement('div');
            div.className = 'track-item';
            div.id = `item-${indexOriginal}`;
            div.innerText = `${indexOriginal + 1}. ${v.title}`;
            div.onclick = () => {
                const idxNaFila = ordemReproducao.indexOf(indexOriginal);
                tocarIndice(idxNaFila);
            };
            container.appendChild(div);
        });
    }

    function atualizarDestaqueLista() {
        document.querySelectorAll('.track-item').forEach(el => el.classList.remove('playing'));
        const indexOriginal = ordemReproducao[ponteiro];
        const ativo = document.getElementById(`item-${indexOriginal}`);
        if (ativo) {
            ativo.classList.add('playing');
            ativo.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }
</script>
</body>
</html>
